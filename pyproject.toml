[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geocrime-stl"
version = "0.2.1"
description = "An ETL for fetching/cleaning St. Louis crime data sets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "pyarrow>=14",
    "pandas>=3.0.3",
    "requests>=2.34.2"
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "geocrime_stl",
    "geocrime_stl.etl",
    "geocrime_stl.insights",
    "geocrime_stl.utils"
]
include-package-data = true

[tool.setuptools.package-data]
geocrime_stl = ["data/*.geojson"]