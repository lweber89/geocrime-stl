# Builds the whole public site and deploys it to GitHub Pages:
#   /            the package documentation (MkDocs)
#   /dashboard/  the crime dashboard, with its data feed rebuilt from the master dataset
# Runs on every push to main, by hand, and from the monthly-update workflow after new data is committed.
name: docs

on:
    push:
        branches:
            - main
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # always the tip of main, so a run started by the monthly update sees the data it just committed
                  ref: main
                  fetch-depth: 0

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_dev.txt
                  pip install -e .

            - name: Build documentation
              run: mkdocs build

            - name: Build the dashboard and its data feed
              env:
                  GEOCRIME_DATA_DIR: ${{ github.workspace }}/data
              run: |
                  mkdir -p site/dashboard
                  cp -r dashboard/. site/dashboard/
                  rm -f site/dashboard/README.md
                  python -m geocrime_stl.utils.web_export --out site/dashboard/data
                  ls -la site/dashboard/data | head -n 8
                  du -sh site

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
